name: Deploy Frontend

on:
  push:
    branches:
      - main 
  pull_request:
    branches:
      - main
      - dev

jobs:
  component-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci 

      - name: Run Cypress Component Tests
        uses: cypress-io/github-action@v6
        with:
          install-command: npm ci
          runTests: true
          component: true
          browser: chrome
          record: false

  e2e-tests:
    needs: component-tests 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Start Backend (Optional: Use a Mock API Instead)
        run: |
          docker-compose up -d backend
          sleep 10 # Give backend time to start

      - name: Run Cypress E2E Tests
        uses: cypress-io/github-action@v6
        with:
          install-command: npm ci
          start: npm run dev
          wait-on: 'http://localhost:3000'
          browser: chrome
          record: false

  build-and-deploy:
    needs: e2e-tests 
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci 

      - name: Build Frontend
        run: npm run build
        env:
          VITE_REACT_APP_API_URL: ${{ secrets.VITE_REACT_APP_API_URL }}

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          docker build --build-arg VITE_REACT_APP_API_URL=${{ secrets.VITE_REACT_APP_API_URL }} -t ${{ secrets.DOCKERHUB_USERNAME }}/ispy-frontend:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ispy-frontend:latest
          
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: |
            ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/ispy-frontend:latest
            docker stop frontend-container || true
            docker rm frontend-container || true
            docker run -d --name frontend-container -p 8080:80 \
              --restart always ${{ secrets.DOCKERHUB_USERNAME }}/ispy-frontend:latest
            sudo systemctl restart nginx
